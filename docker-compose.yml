services:
  postgres:
    image: postgres:16-alpine
    container_name: money_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: money_db
      # 시각은 전부 UTC로 저장한다. 표시 기준 타임존은 프로젝트마다 따로 둔다
      # (Project.timezone). 이미지 기본값에 의존하면 환경에 따라
      # createdAt의 CURRENT_TIMESTAMP가 흔들린다.
      TZ: UTC
      PGTZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
